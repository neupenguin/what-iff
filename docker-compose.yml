services:
  # Generates this install's JWT and token-encryption secrets on first run (32
  # random bytes each, hex-encoded), so `docker compose up` needs no setup. Every
  # install gets its own random values and nothing is shipped in the repository.
  # An existing file is never regenerated: TOKEN_ENCRYPTION_SECRET decrypts what
  # is already stored. The API loads the file without overriding anything already
  # set, so a value from your shell or .env still wins.
  secrets-init:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        set -e
        f=/run/whatiff-secrets/secrets.env
        fail() { echo "secrets-init: $$*" >&2; exit 1; }
        # A usable secret is exactly 64 lowercase hex characters.
        valid() { case "$$1" in ''|*[!0-9a-f]*) return 1 ;; esac; [ "$${#1}" -eq 64 ]; }
        gen() { head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
        if [ ! -s "$$f" ]; then
          umask 077
          # Generated in this shell and checked before anything is written: a
          # failure inside $$(gen) would otherwise produce an empty value.
          a=$$(gen); b=$$(gen); c=$$(gen)
          for v in "$$a" "$$b" "$$c"; do
            valid "$$v" || fail "could not generate a secret (head, od or /dev/urandom failed)"
          done
          printf 'JWT_SECRET=%s\nJWT_REFRESH_SECRET=%s\nTOKEN_ENCRYPTION_SECRET=%s\n' "$$a" "$$b" "$$c" > "$$f.tmp"
          chown 65532:0 "$$f.tmp" || fail "could not set the owner of $$f.tmp; check the volume's filesystem permissions"
          chmod 400 "$$f.tmp" || fail "could not set the mode of $$f.tmp; check the volume's filesystem permissions"
          mv "$$f.tmp" "$$f"
        fi
        # Checked on every run: a file that is invalid now would otherwise stay
        # invalid forever, since a non-empty file is never regenerated.
        n=0
        while IFS='=' read -r k v; do
          case "$$k" in
            JWT_SECRET|JWT_REFRESH_SECRET|TOKEN_ENCRYPTION_SECRET) ;;
            *) fail "$$f has an unexpected line ($$k)" ;;
          esac
          valid "$$v" || fail "$$f has an invalid $$k. Remove this project's secrets volume to generate new ones; anything already encrypted becomes unreadable."
          n=$$((n + 1))
        done < "$$f"
        [ "$$n" -eq 3 ] || fail "$$f should hold 3 secrets but holds $$n"
        # Re-asserted on every run, so ownership and mode cannot drift.
        chown 65532:0 "$$f" || fail "could not set the owner of $$f; check the volume's filesystem permissions"
        chmod 400 "$$f" || fail "could not set the mode of $$f; check the volume's filesystem permissions"
    volumes:
      - secrets:/run/whatiff-secrets
    restart: "no"

  local-files-init:
    image: busybox:1.36
    command: sh -c "mkdir -p /tmp/chat-app-files && chown -R 65532:0 /tmp/chat-app-files && chmod -R 775 /tmp/chat-app-files"
    volumes:
      - local-files:/tmp/chat-app-files
    restart: "no"

  api:
    build:
      context: .
    # Optional so db-only bring-up (make db-up, scripts/mock-e2e.sh, CI) works
    # on a fresh clone before `cp .env.example .env`.
    env_file:
      - path: .env
        required: false
    environment:
      # Use CHATAPP_* variable names to avoid accidental overrides from shell env
      # used by native (non-docker) development.
      SERVER_HOST: ${CHATAPP_SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${CHATAPP_SERVER_PORT:-8080}
      DB_TYPE: ${CHATAPP_DB_TYPE:-postgres}
      DB_HOST: ${CHATAPP_DB_HOST:-db}
      DB_PORT: ${CHATAPP_DB_PORT:-5432}
      DB_USER: ${CHATAPP_DB_USER:-chatapp}
      DB_PASSWORD: ${CHATAPP_DB_PASSWORD:-chatapp}
      DB_NAME: ${CHATAPP_DB_NAME:-chatapp}
      # This compose stack's Postgres has no TLS listener — explicit opt-out,
      # not the app's default (which is "require"; see internal/database/db.go).
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      # Defaults to false: a real deployment pointed at a real database must
      # opt in explicitly. Set to true in your own .env for fast local schema
      # cleanup during iterative development (still gated on ENV being one of
      # development/test/local — see IsExplicitLocalEnv).
      DESTRUCTIVE_MIGRATION: ${DESTRUCTIVE_MIGRATION:-false}
      # No fallback value for anything below this line: a shipped default
      # would be public the moment this repo is public, so compose leaves
      # these unset unless your shell or .env provides them. The server
      # validates JWT_SECRET/JWT_REFRESH_SECRET/TOKEN_ENCRYPTION_SECRET at
      # boot and refuses to start on a missing, short, or known-placeholder
      # value — see internal/auth.ValidateSecret and
      # datastore.ValidateTokenEncryptionSecret. When neither your shell nor .env
      # sets the three secrets, the API loads the ones secrets-init generated for
      # this install (above); they are created on your machine, not shipped.
      OPENAI_API_KEY:
      ANTHROPIC_API_KEY:
      # LLM backend selector (ADR 0x018). Empty default preserves the app's
      # real-provider behaviour for normal `docker compose up`; set
      # LLM_BACKEND=mock in your shell to run the in-process deterministic mock
      # (no provider egress/keys) — what the @mock-only e2e/visual suites need.
      LLM_BACKEND: ${LLM_BACKEND:-}
      JWT_SECRET:
      JWT_REFRESH_SECRET:
      TOKEN_ENCRYPTION_SECRET:
      BCRYPT_COST: ${BCRYPT_COST:-12}
      # No fallback here either: compose supplying "development" would
      # silently satisfy IsExplicitLocalEnv()'s explicit-ENV gate for anyone
      # who never configured anything. Set it in your .env (as .env.example
      # already does) or export it in your shell.
      ENV:
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      # S3 file archiving — leave empty to use the local dev file store.
      S3_FILE_BUCKET: ${S3_FILE_BUCKET:-}
      # Cognito is optional for local development. Leave blank to use local JWT auth only.
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      # Billing feature flag - set to "true" to enable Stripe integration
      REQUIRE_BILLING: ${REQUIRE_BILLING:-false}
      # Stripe configuration (only used when REQUIRE_BILLING=true)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PLAN_PRICE_ID: ${PLAN_PRICE_ID:-}
      PLAN_PRICE_ID_CASUAL: ${PLAN_PRICE_ID_CASUAL:-}
      PLAN_PRICE_ID_REGULAR: ${PLAN_PRICE_ID_REGULAR:-}
      PLAN_PRICE_ID_POWER: ${PLAN_PRICE_ID_POWER:-}
      STRIPE_OVERAGE_PRICE_ID: ${STRIPE_OVERAGE_PRICE_ID:-}
      STRIPE_METER_NAME: ${STRIPE_METER_NAME:-}
      # New users receive a one-time free-trial credit allowance (tokens.core quota
      # bucket, see datastore.TrialCoreCredits). No env var configures the free tier;
      # the legacy FREE_TIER_MESSAGE_LIMIT message counter has been removed.
      # Enable AgentJobsScheduler
      ENABLE_AGENTJOBS_SCHEDULER: ${ENABLE_AGENTJOBS_SCHEDULER:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:8082,http://localhost:4200,http://localhost:4201}
    # Load the generated secrets. The server's env-file loader never overrides
    # a variable that is already set, so shell and .env values take precedence.
    command: ["-env", "/run/whatiff-secrets/secrets.env"]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      local-files-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports:
      - "${CHATAPP_API_PORT:-8080}:8080"
    volumes:
      # Persist local file store across container rebuilds (no-op when S3_FILE_BUCKET is set).
      - local-files:/tmp/chat-app-files
      - secrets:/run/whatiff-secrets:ro

  web:
    build:
      context: ./web/app
      args:
        API_URL: ${PERSONAL_ASSISTANT_API_URL:-http://localhost:8080/api}
        AUTH_MODE: ${PERSONAL_ASSISTANT_AUTH_MODE:-local}
        ENABLE_GALLERY_EXPRESSION_ASSIGNMENT: ${PERSONAL_ASSISTANT_ENABLE_GALLERY_EXPRESSION_ASSIGNMENT:-false}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${PERSONAL_ASSISTANT_PORT:-8081}:80"

  # ── Database ──────────────────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${CHATAPP_DB_USER:-chatapp}
      POSTGRES_PASSWORD: ${CHATAPP_DB_PASSWORD:-chatapp}
      POSTGRES_DB: ${CHATAPP_DB_NAME:-chatapp}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${CHATAPP_DB_USER:-chatapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${CHATAPP_DB_EXPOSED_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

volumes:
  db-data:
  local-files:
  secrets:
